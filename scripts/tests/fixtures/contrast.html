<!doctype html>
<html><head><meta charset="utf-8"><title>contrast fixture</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Helvetica,Arial,sans-serif}
.t{position:absolute;left:20px;margin:0;white-space:nowrap}
#good{top:10px;font-size:16px;color:#000}
#faint{top:40px;font-size:16px;color:#888}
#large{top:70px;font-size:32px;color:#888}
#gradbox{position:absolute;left:400px;top:10px;width:300px;height:60px;background:linear-gradient(90deg,#0C1927,#305EFF)}
#grad{position:absolute;left:10px;top:18px;font-size:16px;color:#fff;margin:0}
#photo{position:absolute;left:400px;top:100px;width:300px;height:60px}
#overphoto{left:410px;top:118px;font-size:16px;color:#fff}
#texture{top:120px;font-size:12px;color:#eee}
#late{top:150px;font-size:16px;color:#ccc}
</style>
</head><body>
<p class="t" id="good">Readable line</p>
<p class="t" id="faint">Faint line</p>
<p class="t" id="large">Large faint</p>
<div id="gradbox"><p id="grad">On the gradient</p></div>
<img id="photo" src="dark.png" alt="">
<p class="t" id="overphoto">Over the photo</p>
<p class="t" id="texture" data-texture>texture texture texture</p>
<p class="t" id="late">Late faint line</p>
<script>
// A film page for contrast.mjs. At t=1 it shows passing text, one failing normal line (#888 on white,
// 3.54:1), the same grey at 32 px (passes as large text), text on a gradient and over an image, and
// low-contrast texture text marked data-texture. "Late faint line" (#ccc, about 1.6:1) is hidden
// until t=0.5. Query flags: ?onlygood keeps only passing text; ?nofaint drops only the faint line; ?notext has no text at all.
const q = new URLSearchParams(location.search);
if (q.has('onlygood')) for (const id of ['faint', 'late']) document.getElementById(id).remove();
if (q.has('nofaint')) document.getElementById('faint').remove();
if (q.has('notext')) for (const el of [...document.querySelectorAll('p')]) el.remove();
const DURATION = 2;
function seek(t) {
  const late = document.getElementById('late');
  if (late) late.style.opacity = t < 0.5 ? 0 : 1;
}
window.DURATION = DURATION;
window.seek = seek;
window.ready = Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = r; im.onerror = r; }))))
  .then(() => document.fonts.ready).then(() => { seek(0); return true; });
</script></body></html>
