<!doctype html>
<html><head><meta charset="utf-8"><title>capture fixture</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#box{position:absolute;inset:0}</style>
</head><body><div id="box"></div>
<script>
// A tiny film that obeys the page contract: window.DURATION, window.seek(t), window.ready.
// Query flags make it break the contract on purpose: ?noready, ?badimg, ?noimg.
const q = new URLSearchParams(location.search);
const DURATION = 0.5;
if (!q.has('noimg')) {
  const img = document.createElement('img');
  img.src = q.has('badimg') ? 'missing.png' : 'dot.png';
  img.style.cssText = 'position:absolute;left:0;top:0;width:8px';
  document.body.appendChild(img);
}
function seek(t) {
  const v = Math.round(255 * Math.min(1, Math.max(0, t / DURATION)));
  document.getElementById('box').style.background = `rgb(${v},0,${255 - v})`;
}
window.DURATION = DURATION;
window.seek = seek;
if (!q.has('noready')) {
  window.ready = Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => { im.onload = r; im.onerror = r; })))).then(() => { seek(0); return true; });
}
</script></body></html>
